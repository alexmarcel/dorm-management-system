# Replace the hostname and configure your TLS certificate before use.
server {
    listen 443 ssl;
    server_name paini.example.edu;
    # ssl_certificate /etc/letsencrypt/live/paini.example.edu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/paini.example.edu/privkey.pem;
    client_max_body_size 1m;
    # Keep this limit aligned with MAX_BACKUP_BYTES; stream large archives.
    location = /api/settings/restore/upload {
        client_max_body_size 1g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
    location /api/settings/import/ {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
server {
    listen 80;
    server_name paini.example.edu;
    return 301 https://$host$request_uri;
}
